# Builds and verifies the macOS app without publishing anything.
# Runs on pushes to branches named ci/** and can be started from the Actions tab.
name: macOS check

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Add Intel macOS terminal binaries
        run: npm install --no-save --ignore-scripts --force "@lydell/node-pty-darwin-x64@$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")"
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder --mac --publish never
      - name: Verify macOS signatures and native modules
        run: bash scripts/ci/verify-mac.sh
      - name: Run the packaged macOS app
        if: always()
        run: bash scripts/ci/run-mac-app.sh
